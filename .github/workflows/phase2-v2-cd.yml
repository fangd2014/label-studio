name: "Phase2 V2 Continuous Delivery"

on:
  workflow_dispatch:
  push:
    branches:
      - codex/operation-pages-zh-cn
    tags:
      - 'v2'
      - 'v2.*'
      - 'v2-*'

env:
  POETRY_VERSION: 2.3.2
  DJANGO_SETTINGS_MODULE: core.settings.label_studio
  COLLECT_ANALYTICS: false
  JSON_LOG: 0

jobs:
  phase2-v2-delivery:
    name: "Phase2 V2 Delivery"
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - name: "Set up Python 3.12"
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'poetry'

      - name: "Install poetry"
        run: pipx install "poetry==${{ env.POETRY_VERSION }}"

      - name: Install OS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi8 libldap2-dev libsasl2-dev libssl-dev libxml2-dev libxslt-dev python3-dev

      - name: Install Python dependencies
        run: poetry install --with test

      - name: Run phase2 v2 pipeline
        run: |
          bash scripts/phase2_v2_pipeline.sh \
            --base-url http://localhost:8080 \
            --image-tag label-studio:phase2-v2-${{ github.sha }} \
            --output-dir test_artifacts/phase2-v2-ci

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-v2-artifacts
          path: |
            test_artifacts/phase2-v2-ci/**
            TEST_REPORT_PHASE2_V2.md
