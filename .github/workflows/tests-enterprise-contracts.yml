name: "Tests Enterprise Contracts"

on:
  workflow_dispatch:
  push:
    branches:
      - codex/operation-pages-zh-cn

env:
  POETRY_VERSION: 2.3.2

jobs:
  enterprise-smoke:
    name: "Enterprise Smoke"
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - name: "Set up Python 3.12"
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'poetry'

      - name: "Install poetry"
        run: pipx install "poetry==${{ env.POETRY_VERSION }}"

      - name: Install OS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi8 libldap2-dev libsasl2-dev libssl-dev libxml2-dev libxslt-dev python3-dev

      - name: Install Python dependencies
        run: poetry install --with test

      - name: Run enterprise smoke script
        run: bash scripts/enterprise/smoke_enterprise.sh

      - name: Upload enterprise artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-smoke-artifacts
          path: |
            test_artifacts/enterprise-smoke/**
            TEST_REPORT_PHASE2_V2.md
