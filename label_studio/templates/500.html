{% extends 'simple.html' %}
{% load static %}

{% block page_labeling %}
  <title>500 | Label Studio</title>
  {{ block.super }}
{% endblock %}

{% block head %}
  <link rel="stylesheet" href="{{ settings.HOSTNAME }}{% static 'css/error.css' %}"/>
{% endblock %}


{% block content %}
<div class="ls-global-error">
  <img class="ls-global-error__heidi" src="{{ settings.HOSTNAME }}{% static 'images/heidi-500.svg' %}" alt="Heidi 出现了点问题" draggable="false" />
  <h1>糟糕，系统发生了错误。</h1>
  <h2>可以尝试以下操作：</h2>
  <p class="ls-global-error__actions">
    <button onClick="history.back()">返回上一页</button>
    <button onClick="location.reload()">刷新页面</button>
    <button onClick="window.location.href='/'" class="ls-global-error__primary_button">返回首页</button>
  </p>
</div>
{% endblock %}
